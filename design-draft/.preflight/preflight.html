/* 全国农作物种质资源信息平台 — Redesign 设计稿令牌 */
/* 保留客户指定蓝色主色，重构其使用方式，让蓝色成为点睛色而非大面积背景色 */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

@theme inline {
  /* Primary Blue — 客户指定主色，保持色相 257.5 */
  --color-primary-50: oklch(0.977 0.014 257.5);
  --color-primary-100: oklch(0.950 0.033 257.5);
  --color-primary-200: oklch(0.905 0.063 257.5);
  --color-primary-300: oklch(0.840 0.106 257.5);
  --color-primary-400: oklch(0.730 0.155 257.5);
  --color-primary-500: oklch(0.535 0.176 257.5);
  --color-primary-600: oklch(0.475 0.169 257.5);
  --color-primary-700: oklch(0.415 0.150 257.5);
  --color-primary-800: oklch(0.355 0.124 257.5);
  --color-primary-900: oklch(0.300 0.100 257.5);
  --color-primary-950: oklch(0.245 0.071 257.5);

  /* Neutral scale — 冷灰，与蓝色协调 */
  --color-neutral-50: #f8fafc;
  --color-neutral-100: #f1f5f9;
  --color-neutral-200: #e2e8f0;
  --color-neutral-300: #cbd5e1;
  --color-neutral-400: #94a3b8;
  --color-neutral-500: #64748b;
  --color-neutral-600: #475569;
  --color-neutral-700: #334155;
  --color-neutral-800: #1e293b;
  --color-neutral-900: #0f172a;
  --color-neutral-950: #020617;

  /* Radius scale */
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-2xl: 1.5rem;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Light mode semantic tokens */
:root {
  --sn-background: #ffffff;
  --sn-foreground: #0f172a;
  --sn-card: #ffffff;
  --sn-card-foreground: #0f172a;
  --sn-popover: #ffffff;
  --sn-popover-foreground: #0f172a;
  --sn-primary: oklch(0.535 0.176 257.5);
  --sn-primary-foreground: #ffffff;
  --sn-secondary: #f1f5f9;
  --sn-secondary-foreground: #1e293b;
  --sn-muted: #f1f5f9;
  --sn-muted-foreground: #64748b;
  --sn-accent: #f1f5f9;
  --sn-accent-foreground: #1e293b;
  --sn-border: #e2e8f0;
  --sn-input: #e2e8f0;
  --sn-ring: oklch(0.535 0.176 257.5);
  --sn-radius-sm: 0.375rem;
  --sn-radius-md: 0.5rem;
  --sn-radius-lg: 0.75rem;
  --sn-radius-xl: 1rem;
}

/* Dark mode semantic tokens */
.dark {
  --sn-background: #020617;
  --sn-foreground: #f8fafc;
  --sn-card: #0f172a;
  --sn-card-foreground: #f8fafc;
  --sn-popover: #0f172a;
  --sn-popover-foreground: #f8fafc;
  --sn-primary: oklch(0.535 0.176 257.5);
  --sn-primary-foreground: #ffffff;
  --sn-secondary: #1e293b;
  --sn-secondary-foreground: #f1f5f9;
  --sn-muted: #1e293b;
  --sn-muted-foreground: #94a3b8;
  --sn-accent: #1e293b;
  --sn-accent-foreground: #f1f5f9;
  --sn-border: rgba(148, 163, 184, 0.2);
  --sn-input: rgba(148, 163, 184, 0.2);
  --sn-ring: oklch(0.535 0.176 257.5);
}

/* Base */
html, body {
  height: 100%;
}

body {
  font-family: var(--font-sans);
  background-color: var(--sn-background);
  color: var(--sn-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Headings */
h1, h2, h3, h4, h5, h6 {
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.25;
}

/* Selection */
::selection {
  background-color: color-mix(in oklch, var(--sn-primary) 25%, transparent);
  color: var(--sn-foreground);
}
